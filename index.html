<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful blackjack game designed for info screen displays">
    <title>Blackjack - Info Screen</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header class="game-header">
            <h1>♠ BLACKJACK ♥</h1>
            <div class="score-display">
                <div class="stat">
                    <span class="stat-label">Wins</span>
                    <span class="stat-value" id="wins">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Losses</span>
                    <span class="stat-value" id="losses">0</span>
                </div>
                <div class="stat">
                    <span class="stat-label">Ties</span>
                    <span class="stat-value" id="ties">0</span>
                </div>
            </div>
        </header>

        <main class="game-area">
            <!-- Table Rules (printed on felt) -->
            <div class="table-rules">
                <div class="rule-main">Dealer Stands on Soft 17</div>
                <div>Blackjack Pays 3 to 2</div>
                <div>Insurance Pays 2 to 1</div>
            </div>

            <section class="hand dealer-section">
                <div class="hand-header">
                    <h2>Dealer</h2>
                    <span class="hand-value" id="dealer-value">0</span>
                </div>
                <div class="cards" id="dealer-cards"></div>
            </section>

            <div class="game-status" id="game-status">
                <span class="status-text">Press DEAL to start</span>
            </div>

            <section class="hand player-section">
                <div class="hand-header">
                    <h2>Player</h2>
                    <span class="hand-value" id="player-value">0</span>
                </div>
                <div class="cards" id="player-cards"></div>
            </section>
        </main>

        <footer class="controls">
            <button class="btn btn-deal" id="deal-btn" onclick="startGame()">
                <span class="btn-icon">🎴</span>
                DEAL
            </button>
            <button class="btn btn-hit" id="hit-btn" onclick="hit()" disabled>
                <span class="btn-icon">➕</span>
                HIT
            </button>
            <button class="btn btn-stand" id="stand-btn" onclick="stand()" disabled>
                <span class="btn-icon">✋</span>
                STAND
            </button>
        </footer>
    </div>

    <script src="game.js"></script>
</body>
</html>
